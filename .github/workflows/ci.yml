name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # Use the interpreter placed on PATH by setup-python. The Windows
      # `py` launcher may select a different system installation (for
      # example Python 3.14), bypassing the requested 3.13 runtime.
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check .
