<div class="card">
    <h2>步骤 3：预览与导出</h2>
    <p>群聊：{{ group_name }}</p>
    <p>时间范围：{{ start_date }} ~ {{ end_date }}</p>
    <p>共匹配 {{ parsed_tasks|length }} 条任务消息</p>
    <div class="form-group">
        <label>目标Sheet：</label>
        <select id="selected-sheet" name="sheet_name" class="input-text">
            <option value="">-- 请选择 --</option>
            {% for option in sheet_names %}
            <option value="{{ option }}" {% if option == sheet_name %}selected{% endif %}>{{ option }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>导出到文件：</label>
        <input type="text" id="output-path" name="output_path"
               value="{{ default_output_path }}" class="input-text" style="width:100%">
    </div>
    <table class="preview-table">
        <tr><th>日期</th><th>任务内容</th><th>目标Sheet</th></tr>
        {% for task in parsed_tasks %}
        <tr>
            <td>{{ task.date.isoformat() }}</td>
            <td><ul class="task-list">{% for item in task.tasks %}<li>{{ item }}</li>{% endfor %}</ul></td>
            <td>{{ sheet_name or "未匹配" }}</td>
        </tr>
        {% endfor %}
    </table>
    <div class="btn-group">
        <a href="/wizard/2" class="btn btn-secondary">← 返回修改</a>
        <button class="btn btn-primary"
                hx-post="/api/export" hx-include="#output-path,#selected-sheet"
                hx-target="#export-result" hx-swap="innerHTML">确认导出 →</button>
    </div>
    <div id="export-result"></div>
</div>
