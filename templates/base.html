<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>{% block title %}微信消息提取器{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <a class="skip-link" href="#wizard-workspace">跳到当前步骤</a>
    <div class="app-shell">
        <header class="app-header">
            <div class="brand-bar">
                <a class="brand" href="/wizard/1" aria-label="微信消息提取器首页">
                    <span class="brand-mark" aria-hidden="true">微</span>
                    <span>
                        <strong>微信消息提取器</strong>
                        <small>本地消息整理与 Excel 导出</small>
                    </span>
                </a>
                <p class="local-status">
                    <span aria-hidden="true">●</span>
                    <span>默认本机处理</span>
                </p>
            </div>
            {% include "components/stepper.html" %}
        </header>

        <main class="wizard-main" id="main-content">
            {% block main %}{% endblock %}
        </main>

        <div id="wizard-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

        <footer class="privacy-footer">
            <span aria-hidden="true">⌂</span>
            <p>数据库与 Excel 默认仅在本机处理；启用 AI 或语音时会先征得确认。</p>
        </footer>
    </div>
    <script>
        document.body.addEventListener("htmx:beforeSwap", function (event) {
            if (event.detail.xhr.status >= 400 && event.detail.xhr.status < 600) {
                event.detail.shouldSwap = true;
                event.detail.isError = false;
            }
        });
    </script>
    <script src="/static/wizard.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
