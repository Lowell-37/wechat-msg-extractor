wechat:
  auto_detect: true
  data_dir: null
  version_dir: null
  # WechatExplorer 本机 API；令牌使用本机 DPAPI 凭据存储，环境变量可临时覆盖。
  explorer_base_url: "http://127.0.0.1:6131/api/v1"

excel:
  # 可留空并在连接页手动选择 .xlsx 模板。
  template_path: ""
  output_dir: "./export/excel"

matching:
  group_sheet_map: {}

task_parsing:
  task_msg_pattern: null
  date_pattern: null
  task_item_pattern: null

media:
  save_images: true
  save_voice: true
  save_video: true
  export_dir: "./export"

server:
  host: "127.0.0.1"
  port: 8888

ai:
  provider: "deepseek"
  api_key: ""
  api_base: "https://api.deepseek.com"
  model: "deepseek-chat"
  enabled: true

voice:
  enabled: false
  transcriber: "openai"
  api_key: ""
  api_base: "https://api.openai.com"
  model: "whisper-1"
